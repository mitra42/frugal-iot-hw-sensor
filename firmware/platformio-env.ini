; ==== Frugal-IoT V0.2 sensor board ======================================================
; For frugal-iot-demo/platformio.ini - paste below the existing envs; uses its [common].
; Copy variants/frugal_iot_v02/ into the project's variants/ folder.
; Pin map: DECISIONS.md D3; connectors D4/D5 (J2 = sensors, J3 = RS485, J13/J5 = spares).
[env:frugal_iot_v02]
platform = ${common.platform_esp32}
board = esp32-c3-devkitm-1                ; generic C3, 4 MB = the -N4 module; defines ARDUINO_ESP32C3_DEV
board_build.variants_dir = variants
board_build.variant = frugal_iot_v02      ; LED_BUILTIN=8 plain LED, SDA=6, SCL=7
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="frugal_iot_v02"'
    -D ARDUINO_FRUGAL_IOT_V02                 ; this board, for code and for scripts/generate_platform_h.py
    -D ARDUINO_USB_MODE=1                     ; native USB on the USB-C: no USB-UART chip
    -D ARDUINO_USB_CDC_ON_BOOT=1              ; Serial = USB
    ; Status LED D4 on GPIO8 is active LOW; the library already inverts it for ARDUINO_ESP32C3_DEV.
    ; --- I2C on J2 pins 2/3 ---
    -D I2C_SDA=6
    -D I2C_SCL=7
    ; --- switched sensor rail: nRAIL_EN (GPIO5) LOW = 3V3_SW on; R10 pull-up = off at reset and
    ; whenever the pin is let go (the library powers down to high impedance). Feeds J2, J3, J13, J5,
    ; the I2C pull-ups and the RS485 transceiver - so it is the whole-node rail.
    -D SYSTEM_POWER0_PIN=5
    ; --- battery: VBAT_SENSE on GPIO3, 1M/1M ---
    -D SENSOR_BATTERY_PIN=3
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=2
    ; --- sensor inputs on J2: SENS1 = GPIO0 (pin 6), SENS2 = GPIO1 (pin 9), both ADC1.
    ; Each has unfitted pull-up (R18/R19, e.g. DS18B20) and filter-cap (C11/C12) positions. Examples:
    ;-D SENSOR_SOIL_PIN=0
    ;-D SENSOR_DS18B20_PIN=1                 ; fit R19 4.7k
    ; --- RS485 / Modbus on J3 pins 2 (A) / 3 (B), fitted by default (D29) ---
    -D SYSTEM_RS485_RX_PIN=20
    -D SYSTEM_RS485_TX_PIN=21
    -D SYSTEM_RS485_DE_PIN=10                 ; HIGH = transmit; RE is tied to DE; R20 = receive at reset
    '-D SYSTEM_RS485_UART=Serial1'            ; Serial is USB; Serial1 can be routed to GPIO20/21
    ;-D SENSOR_SOILMODBUS_WANT               ; turn on for RS485 soil probes
    ;-D SENSOR_SOILMODBUS_AUTOPROVISION
    ; --- spares on J13 (not fitted): GPIO2 (pin 6, ADC, must be high at reset - on-board pull-up)
    ; and GPIO4 (pin 9, ADC). On a board built without RS485, GPIO10 is free on J5 pin 2.
